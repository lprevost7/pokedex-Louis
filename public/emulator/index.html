<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console secrète — Pokémon Rouge Feu</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #10121c; color: #fff3de; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    header { padding: 1rem; text-align: center; }
    h1 { font-size: 1.2rem; margin: 0 0 .75rem; }
    p { font-size: .9rem; line-height: 1.5; }
    button { padding: .65rem 1rem; border: 0; border-radius: .5rem; background: #ffbd73; color: #202332; font: inherit; cursor: pointer; }
    #screen { flex: 1; min-height: 260px; position: relative; }
    #game { width: 100%; height: 100%; position: absolute; inset: 0; }
    #status { margin: .75rem 0 0; }
  </style>
</head>
<body>
  <header>
    <h1>Game Boy Advance · Rouge Feu</h1>
    <p>Utilise le menu de la console pour les commandes et les sauvegardes.<br>Exporte ta sauvegarde avant de fermer la console.</p>
    <button id="reset" type="button">Relancer le jeu</button>
    <p id="status" role="status" aria-live="polite"></p>
  </header>
  <div id="screen"><div id="game"></div></div>
  <script src="emulator.js"></script>
</body>
</html>
