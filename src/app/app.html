<main class="pokedex">
  <button
    class="display-tab"
    type="button"
    (click)="changeDisplayMode()"
  >
    Mode : {{ displayMode }}
  </button>

  <button
    class="team-tab"
    type="button"
    [attr.aria-expanded]="teamTabOpen"
    (click)="toggleTeamTab()"
  >
    Équipe ({{ team.length }}/6)
  </button>

  @if (teamTabOpen) {
    <section class="team-panel" aria-label="Mon équipe Pokémon">
      <h2>Mon équipe</h2>
      @if (team.length === 0) {
        <p>Ton équipe est vide. Clique sur une carte pour ajouter un Pokémon.</p>
      } @else {
        <div class="team-list">
          @for (pokemon of team; track pokemon.id) {
            <div class="team-pokemon">
              <img [src]="pokemon.image" [alt]="pokemon.name">
              <span>{{ pokemon.name }}</span>
            </div>
          }
        </div>
      }
    </section>
  }

  <section class="pokemon-grid" aria-label="Liste des Pokémon">
    @for (pokemon of pokemons; track pokemon.id) {
      <app-pokemon-coponent
        [pokemon]="pokemon"
        [displayMode]="displayMode"
        (teamSelectionChange)="updateTeam($event)"
      />
    }
  </section>
</main>
